<script>
(function(){
  async function openDB(){
    return new Promise(function(res, rej){
      var req = indexedDB.open('tinyphone_db');
      req.onsuccess = function(){ res(req.result); };
      req.onerror = function(){ rej(req.error); };
    });
  }

  async function exportAll(){
    try {
      var names = ['kv','blobs','accounts','chars','messages','memories','worldbooks'];
      var db = await openDB();
      var data = { version:1, exportedAt:new Date().toISOString(), stores:{} };

      for (var name of names){
        var list = await new Promise(function(res, rej){
          var tx = db.transaction(name, 'readonly');
          var req = tx.objectStore(name).getAll();
          req.onsuccess = function(){ res(req.result || []); };
          req.onerror = function(){ rej(req.error); };
        });
        data.stores[name] = [];
        for (var rec of list){
          if (name === 'blobs' && rec.blob){
            var b64 = await new Promise(function(res){
              var r = new FileReader();
              r.onload = function(){ res(r.result); };
              r.readAsDataURL(rec.blob);
            });
            data.stores[name].push({
              id: rec.id, size: rec.size, type: rec.type,
              name: rec.name, createdAt: rec.createdAt, dataUrl: b64
            });
          } else {
            data.stores[name].push(rec);
          }
        }
      }

      var json = JSON.stringify(data);
      var blob = new Blob([json], { type:'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'tinyphone-' + new Date().toISOString().slice(0,10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
      alert('导出成功！文件已保存。\n\n提示：可在文件 App / 下载目录里找到这个 .json 文件。');
    } catch(e){
      alert('导出失败：' + e.message);
    }
  }

  async function importAll(file){
    if (!confirm('导入将清空当前所有数据，确定继续吗？')) return;
    try {
      var text = await file.text();
      var data = JSON.parse(text);
      if (!data.stores) throw new Error('文件格式不正确');

      var db = await openDB();
      var names = ['kv','blobs','accounts','chars','messages','memories','worldbooks'];

      for (var name of names){
        await new Promise(function(res, rej){
          var tx = db.transaction(name, 'readwrite');
          var req = tx.objectStore(name).clear();
          req.onsuccess = function(){ res(); };
          req.onerror = function(){ rej(req.error); };
        });
      }

      for (var name of Object.keys(data.stores)){
        var list = data.stores[name];
        for (var rec of list){
          if (name === 'blobs' && rec.dataUrl){
            var blob = await new Promise(function(res){
              var arr = rec.dataUrl.split(',');
              var mime = (arr[0].match(/:(.*?);/) || [,'image/png'])[1];
              var bstr = atob(arr[1]);
              var n = bstr.length;
              var u8 = new Uint8Array(n);
              while (n--) u8[n] = bstr.charCodeAt(n);
              res(new Blob([u8], { type: mime }));
            });
            await new Promise(function(res, rej){
              var tx = db.transaction(name, 'readwrite');
              var req = tx.objectStore(name).put({
                id: rec.id, blob: blob, size: rec.size, type: rec.type,
                name: rec.name, createdAt: rec.createdAt
              });
              req.onsuccess = function(){ res(); };
              req.onerror = function(){ rej(req.error); };
            });
          } else {
            await new Promise(function(res, rej){
              var tx = db.transaction(name, 'readwrite');
              var req = tx.objectStore(name).put(rec);
              req.onsuccess = function(){ res(); };
              req.onerror = function(){ rej(req.error); };
            });
          }
        }
      }

      alert('导入成功！页面将自动刷新。');
      setTimeout(function(){ location.reload(); }, 800);
    } catch(e){
      alert('导入失败：' + e.message);
    }
  }

  function createUI(){
    if (document.getElementById('tp-backup-panel')) return;
    var phone = document.querySelector('.phone') || document.body;

    var panel = document.createElement('div');
    panel.id = 'tp-backup-panel';
    panel.style.cssText = 'position:absolute;right:14px;bottom:110px;z-index:9999;display:flex;flex-direction:column;gap:10px;';

    var btnCss = 'width:44px;height:44px;border-radius:50%;background:rgba(78,201,142,.92);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(50,120,85,.32);border:1.5px solid rgba(255,255,255,.7);cursor:pointer;backdrop-filter:blur(10px);';

    var expBtn = document.createElement('button');
    expBtn.title = '导出数据';
    expBtn.style.cssText = btnCss;
    expBtn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>';
    expBtn.onclick = exportAll;

    var impBtn = document.createElement('button');
    impBtn.title = '导入数据';
    impBtn.style.cssText = btnCss;
    impBtn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>';
    impBtn.onclick = function(){
      var inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.json,application/json';
      inp.onchange = function(){ if (inp.files[0]) importAll(inp.files[0]); };
      inp.click();
    };

    panel.appendChild(expBtn);
    panel.appendChild(impBtn);
    phone.appendChild(panel);
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(createUI, 1200); });
  } else {
    setTimeout(createUI, 1200);
  }
})();
</script>
</body>
</html>
